<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative AI for Work & Research | Portfolio</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent-teal: #0d9488;
      --accent-orange: #ea580c;
      --accent-purple: #7c3aed;
      --accent-pink: #db2777;
      --dark-navy: #0f172a;
      --text-main: #334155;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --dark-navy: #f8fafc;
      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --bg-body: #090d16;
      --bg-card: #151d2a;
      --border: #263346;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* Top Navigation Header */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 65px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--dark-navy);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      background: linear-gradient(135deg, #2563eb, #0d9488);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.925rem;
      font-weight: 600;
      transition: all 0.2s;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
    }

    .nav-links a:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .theme-btn {
      background: var(--bg-body);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .hero {
      padding: 3.5rem 0 2rem;
      text-align: center;
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.08) 0%, rgba(13, 148, 136, 0.03) 50%, transparent 100%);
    }

    .hero-avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .avatar-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg-card);
      box-shadow: 0 0 0 4px #2563eb, var(--shadow-md);
      transition: transform 0.3s ease;
    }

    .avatar-img:hover {
      transform: scale(1.05);
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--dark-navy);
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 1.25rem;
      font-weight: 500;
    }

    .hero-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hero-meta-badge {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.3rem 0
